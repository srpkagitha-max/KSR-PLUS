<body class="adminHubBody"><div class="adminTopbar"><div><h1>KSR ➕ Question Editor</h1><p>Search Exam → Find Question → Edit & Save</p></div><div class="adminTopActions"><a class="btn gray" href="dashboard.html">← Main Features</a><button class="gray" id="logout">Logout</button></div></div>
<div class="wrap questionEditorPage"><div id="msg"></div>
